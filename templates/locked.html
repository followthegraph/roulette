<!doctype html>
<html>
<head>
  <title>Roulette Dashboard Login</title>
  <style>
    body {
      font-family: Arial;
      background: #111827;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    .card {
      background: #1f2937;
      padding: 32px;
      border-radius: 16px;
      width: 320px;
      box-shadow: 0 10px 40px rgba(0,0,0,.4);
    }

    input {
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      border-radius: 10px;
      border: 1px solid #374151;
      background: #111827;
      color: white;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 16px;
      border: 0;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .error {
      color: #f87171;
      margin-top: 10px;
    }

    .hint {
      color: #9ca3af;
      font-size: 13px;
      margin-top: 8px;
    }
  </style>
</head>

<body>
  <div class="card">
    <h2>Roulette Dashboard</h2>
    <div class="hint">Enter dashboard password</div>

    <input
      id="password"
      type="password"
      placeholder="Password"
      autofocus
    />

    <button onclick="submitPassword()">Login</button>

    <div id="error" class="error"></div>
  </div>

  <script>
    async function submitPassword() {
      const password = document.getElementById("password").value;
      const error = document.getElementById("error");
      error.textContent = "";

      const res = await fetch("/check-password", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ password })
      });

      const data = await res.json();

      if (data.ok) {
        window.location.href = "/";
        return;
      }

      if (data.blockedRedirect) {
        window.location.href = data.blockedRedirect;
        return;
      }

      error.textContent = data.message || "Invalid password";
    }

    document.getElementById("password").addEventListener("keydown", e => {
      if (e.key === "Enter") submitPassword();
    });
  </script>
</body>
</html>
