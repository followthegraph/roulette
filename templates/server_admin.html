<!doctype html>
<html>
<head>
  <title>Roulette Server Admin</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f1115;
      color: #e8e8e8;
      padding: 24px;
    }

    h1 {
      margin-bottom: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(330px, 1fr));
      gap: 18px;
    }

    .card {
      background: #1b1f2a;
      border: 1px solid #2e3444;
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 8px 20px rgba(0,0,0,.25);
    }

    .card h2 {
      margin: 0 0 8px;
      text-transform: capitalize;
    }

    .status-line {
      display: flex;
      justify-content: space-between;
      margin-bottom: 14px;
      color: #aaa;
    }

    .pill {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: bold;
      margin: 4px 4px 4px 0;
    }

    .ok { background: #123d24; color: #72f59a; }
    .bad { background: #4a1616; color: #ff8585; }
    .neutral { background: #333844; color: #cbd3e3; }

    .services {
      margin: 12px 0 16px;
    }

    button {
      background: #2b65f6;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 8px 10px;
      margin: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #477cff;
    }

    button.danger {
      background: #b73535;
    }

    button.danger:hover {
      background: #d64646;
    }

    pre {
      white-space: pre-wrap;
      background: #090b10;
      padding: 10px;
      border-radius: 8px;
      font-size: 12px;
      max-height: 180px;
      overflow: auto;
    }

    .small {
      color: #aaa;
      font-size: 13px;
    }

    .message {
        margin-bottom: 16px;
        padding: 10px 14px;
        border-radius: 10px;
        background: #202637;
        color: #cbd3e3;
    }

    .message.ok {
        background: #123d24;
        color: #72f59a;
    }

    .message.bad {
        background: #4a1616;
        color: #ff8585;
    }
    .action-log-wrap {
    margin-bottom: 18px;
    background: #111827;
    border: 1px solid #2e3444;
    border-radius: 12px;
    overflow: hidden;
  }

  .action-log-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 12px;
    background: #1f2937;
  }

  .action-log-header button {
    width: auto;
    margin: 0;
    padding: 5px 10px;
    background: #374151;
  }

  .action-log {
    max-height: 240px;
    overflow: auto;
    padding: 10px;
    font-family: Consolas, monospace;
    font-size: 12px;
  }

  .log-entry {
    border-bottom: 1px solid #2e3444;
    padding: 8px 0;
    white-space: pre-wrap;
  }

  .log-entry.ok {
    color: #72f59a;
  }

  .log-entry.bad {
    color: #ff8585;
  }

  .log-entry.running {
    color: #cbd3e3;
  }
  </style>
</head>
<body>
  <h1>Roulette Admin Dashboard</h1>
  <div id="message" class="message">Ready.</div>
  <div class="action-log-wrap">
    <div class="action-log-header">
      <b>Action Log</b>
      <button type="button" onclick="clearActionLog()">Clear</button>
      <button onclick="runActionAll('update')">Git Pull All</button>
      <button class="danger" onclick="runActionAll('update_and_restart')">Update + Restart All</button>
    </div>
    <div id="actionLog" class="action-log"></div>
  </div>
  <div id="servers" class="grid"></div>

  <script>
    function pill(label, obj, expected = true) {
      if (!expected) {
        return `<span class="pill neutral">${label}: N/A</span>`;
      }

      const running = obj && obj.running;
      const count = obj && typeof obj.count !== "undefined" ? obj.count : "?";
      const cls = running ? "ok" : "bad";

      return `<span class="pill ${cls}">${label}: ${running ? "ON" : "OFF"} (${count})</span>`;
    }

    async function runActionAll(action) {
      const ok = confirm(`Run ${action} on all servers?`);
      if (!ok) return;

      for (const server of ["classic", "eu", "flash"]) {
        await runAction(server, action, false);
      }
    }

    async function runAction(server, action) {
      const ok = confirm(`Run ${action} on ${server}?`);
      if (!ok) return;

      const msg = document.getElementById("message");

      msg.className = "message";
      msg.textContent = `Running ${action} on ${server}...`;

      addActionLog(server, action, "running");

      try {
        const res = await fetch(`/admin/server-action/${server}/${action}`, {
          method: "POST"
        });

        if (res.status === 401) {
          window.location.href = "/admin/login";
          return;
        }

        let data;

        try {
          data = await res.json();
        } catch {
          if (
            server === "eu" &&
            ["restart_app", "restart_all_clean", "update_and_restart"].includes(action)
          ) {
            msg.className = "message ok";
            msg.textContent = `${server}: ${action} triggered. Reconnecting...`;

            addActionLog(server, action, "ok", "Restart triggered; connection dropped as expected.");

            setTimeout(loadStatus, 8000);
            return;
          }

          const text = await res.text();
          throw new Error(text.slice(0, 500));
        }

        const details = [
          data.stdout ? `STDOUT:\n${data.stdout}` : "",
          data.stderr ? `STDERR:\n${data.stderr}` : "",
          data.error ? `ERROR:\n${data.error}` : "",
        ].filter(Boolean).join("\n\n");

        if (!data.ok) {
          msg.className = "message bad";
          msg.textContent = `${server}: ${action} failed.`;
          addActionLog(server, action, "bad", details || "Action failed.");
          return;
        }

        msg.className = "message ok";
        msg.textContent = `${server}: ${action} completed.`;
        addActionLog(server, action, "ok", details || "Completed successfully.");

        setTimeout(loadStatus, 2500);

      } catch (err) {
        msg.className = "message bad";
        msg.textContent = `${server}: ${action} request error.`;
        addActionLog(server, action, "bad", err.message || String(err));
      }
    }

    function addActionLog(server, action, status, details = "") {
      const log = document.getElementById("actionLog");
      if (!log) return;

      const time = new Date().toLocaleTimeString();

      const div = document.createElement("div");
      div.className = `log-entry ${status}`;

      div.textContent =
        `[${time}] ${server} :: ${action} :: ${status.toUpperCase()}` +
        (details ? `\n${details}` : "");

      log.prepend(div);
    }

    function clearActionLog() {
      const log = document.getElementById("actionLog");
      if (log) log.innerHTML = "";
    }


    async function loadStatus() {
      const res = await fetch("/admin/server-status?t=" + Date.now());
      const data = await res.json();

      const root = document.getElementById("servers");
      root.innerHTML = "";

      for (const [name, wrapper] of Object.entries(data)) {
        let raw = wrapper.stdout || "{}";
        let status = null;

        try {
          status = JSON.parse(raw);
        } catch {
          status = null;
        }

        if (!status) {
          root.innerHTML += `
            <div class="card">
              <h2>${name}</h2>
              <span class="pill bad">ERROR</span>
              <pre>${wrapper.stderr || wrapper.stdout || "No output"}</pre>
            </div>
          `;
          continue;
        }

        const collectorExpected = status.collector && status.collector.expected;

        root.innerHTML += `
          <div class="card">
            <h2>${name}</h2>

            <div class="status-line">
              <span>${status.wheel_id || ""}</span>
              <span>${status.checked_at || ""}</span>
            </div>

            <div class="services">
              ${pill("App", status.app)}
              ${pill("Tunnel", status.tunnel)}
              ${pill("Persistence", status.persistence)}
              ${pill("Browser", status.browser)}
              ${pill("Collector", status.collector, collectorExpected)}
              ${pill("Health", { running: status.health && status.health.ok, count: status.port })}
            </div>

            <div>
                <button onclick="runAction('${name}', 'restart_app')">Restart App</button>
                <button onclick="runAction('${name}', 'restart_tunnel')">Restart Tunnel</button>
                <button onclick="runAction('${name}', 'restart_persistence')">Restart Persistence</button>
                ${collectorExpected ? `<button onclick="runAction('${name}', 'restart_collector')">Restart Collector</button>` : ""}
                <button onclick="runAction('${name}', 'update')">Git Pull</button>
                <button class="danger" onclick="runAction('${name}', 'update_and_restart')">Update + Restart</button>
                <button class="danger" onclick="runAction('${name}', 'restart_all_clean')">Clean Restart</button>
            </div>

            <p class="small">Port: ${status.port}</p>
          </div>
        `;
      }
    }

    loadStatus();
    setInterval(loadStatus, 15000);
  </script>
</body>
</html>
